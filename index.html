</style><header><button id="back" hidden>‹ 一覧</button><h1>つながりノート</h1><span class="spacer"></span><small id="status">自分の考えを、自分の配置で。</small><button id="backup">保存書出</button><button id="restore">復元</button><input type="file" id="import" accept="application/json" hidden></header>
<main id="home"><span class="tag">YOUR CONNECTIONS, YOUR WAY</span><h2>何を整理しよう？</h2><p style="color:#647870;line-height:1.8">サンプルを書き換えて始められます。<br>位置も、順序も、つながりも、あとから自由に。</p><div id="templates"></div><h3 style="margin-top:32px">マイマップ</h3><div id="maps"></div><p><small>この端末のブラウザに自動保存。大切な記録は「保存書出」でバックアップしてください。</small></p></main>

<dialog id="nodeDialog"><h3>項目を編集</h3><label>名前</label><input id="titleInput"><label>種類</label><select id="kind"><option>項目</option><option>人物</option><option>出来事</option><option>財産</option><option>組織</option><option>技能</option><option>疑問</option></select><label>メモ</label><textarea id="note"></textarea><label>URL</label><input id="url" type="url" placeholder="https://"><button id="openUrl" style="margin-top:6px">登録したURLを開く</button><label>日付（時系列で使う・任意）</label><input id="date" type="date"><label>色</label><input id="color" type="color"><label>写真・画像</label><input id="photo" type="file" accept="image/*"><img id="photoPreview"><button id="removePhoto">画像を外す</button><div class="actions"><button id="deleteNode">削除</button><button onclick="nodeDialog.close()">取消</button><button id="saveNode" class="primary">保存</button></div></dialog>
<dialog id="edgeDialog"><h3>つながりを編集</h3><label>接続元</label><select id="from"></select><label>接続先</label><select id="to"></select><label>関係名（任意）</label><input id="relation" placeholder="所属・親子・原因など"><label><input id="direction" type="checkbox" style="width:auto"> 方向を矢印で表示</label><div class="actions"><button id="deleteEdge">線を外す</button><button onclick="edgeDialog.close()">取消</button><button id="saveEdge" class="primary">保存</button></div></dialog>

const $=id=>document.getElementById(id), uid=()=>crypto.randomUUID(), clone=x=>JSON.parse(JSON.stringify(x));

presets.forEach((p,i)=>{let b=document.createElement('button');b.className='card';let title=document.createElement('b');title.textContent=p[0];let desc=document.createElement('p');desc.textContent=p[1];b.append(title,desc);b.onclick=()=>{let name=prompt('マップの名前',p[0]);if(!name)return;let ns=p.slice(2).map((t,j)=>({id:uid(),title:t,note:j===0?'名前や内容を編集して、自分の記録に変えてください。':'',kind:'項目',url:'',date:'',color:j===0?'#d1ede2':'#ffffff',x:[0,-190,190,0][j],y:[0,150,150,300][j]}));let m={id:uid(),name,nodes:ns,edges:ns.slice(1).map(n=>({id:uid(),from:ns[0].id,to:n.id,label:'',directed:false})),updated:Date.now()};db.maps.push(m);persist();openMap(m)};$('templates').append(b)});

function svg(tag,attrs={},txt){let e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(let k in attrs)e.setAttribute(k,attrs[k]);if(txt!==undefined)e.textContent=txt;return e}

function fit(){let c=$('canvas');let ns=map.nodes;if(!ns.length){view={x:c.clientWidth/2,y:c.clientHeight/2,s:1};draw();return}let xs=ns.map(n=>n.x),ys=ns.map(n=>n.y),minX=Math.min(...xs)-100,maxX=Math.max(...xs)+100,minY=Math.min(...ys)-70,maxY=Math.max(...ys)+70;let s=Math.min(1.2,(c.clientWidth-30)/(maxX-minX),(c.clientHeight-80)/(maxY-minY));view={s,x:c.clientWidth/2-(minX+maxX)/2*s,y:c.clientHeight/2-(minY+maxY)/2*s};draw()}
function editNode(n){nodeEdit=n.id;photoData=n.photo||'';for(let [id,key] of [['titleInput','title'],['kind','kind'],['note','note'],['url','url'],['date','date'],['color','color']])$(id).value=n[key]|| (key==='color'?'#ffffff':'');$('photo').value='';$('photoPreview').src=photoData;$('photoPreview').hidden=!photoData;$('nodeDialog').showModal()}

$('undo').onclick=()=>{if(history.length){future.push(clone(map));replaceSnapshot(history.pop())}};$('redo').onclick=()=>{if(future.length){history.push(clone(map));replaceSnapshot(future.pop())}};
let pointers=new Map(),drag=null,pinch=null;

$('search').onclick=()=>{$('query').value='';$('results').replaceChildren();$('searchDialog').showModal()};$('query').oninput=()=>{$('results').replaceChildren();let q=$('query').value.trim().toLowerCase();if(!q)return;map.nodes.filter(n=>[n.title,n.note,n.kind,n.url].join(' ').toLowerCase().includes(q)).forEach(n=>{let b=document.createElement('button');b.textContent=n.title;b.onclick=()=>{if(timeline)$('time').click();selected=n.id;view.x=$('canvas').clientWidth/2-n.x*view.s;view.y=$('canvas').clientHeight/2-n.y*view.s;draw();showRead(n);$('searchDialog').close()};$('results').append(b)})};
function renderTimeline(){let t=$('timeline');t.replaceChildren();let intro=document.createElement('p');intro.textContent='自分で登録した日付順に表示。マップの位置やつながりは変わりません。';t.append(intro);let dated=map.nodes.filter(n=>n.date).slice().sort((a,b)=>a.date.localeCompare(b.date));let undated=map.nodes.filter(n=>!n.date);[...dated,...undated].forEach(n=>{let d=document.createElement('div');d.className='event';let s=document.createElement('small');s.textContent=n.date||'日付なし';let h=document.createElement('h3');h.textContent=n.title;let p=document.createElement('p');p.textContent=n.note;d.append(s,h,p);d.onclick=()=>{selected=n.id;showRead(n);};t.append(d)})}
$('time').onclick=()=>{timeline=!timeline;$('canvas').style.display=timeline?'none':'block';$('timeline').style.display=timeline?'block':'none';$('hint').style.display=timeline?'none':'block';$('time').textContent=timeline?'マップへ':'時系列';draw()};
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000)}$('backup').onclick=()=>download(new Blob([JSON.stringify({format:'tsunagari-v1',maps:db.maps},null,2)],{type:'application/json'}),'tsunagari-backup.json');$('restore').onclick=()=>$('import').click();$('import').onchange=async()=>{try{let d=JSON.parse(await $('import').files[0].text());if(d.format!=='tsunagari-v1'||!Array.isArray(d.maps)||!d.maps.every(m=>typeof m.name==='string'&&Array.isArray(m.nodes)&&Array.isArray(m.edges)&&m.nodes.every(n=>typeof n.id==='string'&&typeof n.title==='string'&&Number.isFinite(n.x)&&Number.isFinite(n.y))&&m.edges.every(e=>typeof e.from==='string'&&typeof e.to==='string')))throw Error();if(!confirm('バックアップを追加して復元します。現在の記録は残ります。よろしいですか？'))return;d.maps.forEach(m=>{m.id=uid();m.name+='（復元）';db.maps.push(m)});persist();home()}catch{alert('このバックアップは読み込めません')}finally{$('import').value=''}};
$('print').onclick=()=>{let win=window.open('','_blank');if(!win)return alert('ポップアップを許可してください');let doc=win.document;doc.title=map.name;let h=doc.createElement('h1');h.textContent=map.name;doc.body.append(h);let c=$('canvas').cloneNode(true);c.setAttribute('width','100%');c.setAttribute('height','700');let xs=map.nodes.map(n=>n.x),ys=map.nodes.map(n=>n.y);if(xs.length){let minx=Math.min(...xs)-100,miny=Math.min(...ys)-60;c.setAttribute('viewBox',`${minx} ${miny} ${Math.max(...xs)-minx+100} ${Math.max(...ys)-miny+60}`);c.querySelector('#world').removeAttribute('transform')}c.style.cssText='width:100%;height:700px';doc.body.append(c);map.nodes.forEach(n=>{let h=doc.createElement('h3'),p=doc.createElement('p');h.textContent=n.title;p.textContent=[n.date,n.note,n.url].filter(Boolean).join('\n');p.style.whiteSpace='pre-wrap';doc.body.append(h,p);if(n.photo){let im=doc.createElement('img');im.src=n.photo;im.style.maxWidth='200px';doc.body.append(im)}});setTimeout(()=>win.print(),500)};
let readId=null;
function hideRead(){readId=null;$('readPanel').hidden=true;$('readPanel').open=false;}
function showRead(n){readId=n.id;refreshRead();$('readPanel').hidden=false;$('readPanel').open=true;}
function refreshRead(){if(!readId||!map)return;let n=map.nodes.find(n=>n.id===readId);if(!n){hideRead();return;}$('readTitle').textContent=n.title;$('readMeta').textContent=[n.kind,n.date].filter(Boolean).join(' · ');$('readNote').textContent=n.note||'メモはまだありません。';let link=$('readLink');link.hidden=true;link.removeAttribute('href');if(n.url){try{let u=new URL(n.url);if(['https:','http:'].includes(u.protocol)){link.href=u.href;link.textContent='↗ '+n.url;link.hidden=false;}else{$('readNote').textContent+='\nURL：'+n.url;}}catch{$('readNote').textContent+='\nURL：'+n.url;}}let photo=$('readPhoto');photo.hidden=!n.photo;if(n.photo)photo.src=n.photo;else photo.removeAttribute('src');}
$('readEdit').onclick=()=>{let n=map?.nodes.find(n=>n.id===readId);if(n)editNode(n);};
$('readClose').onclick=hideRead;
window.addEventListener('resize',()=>{if(map)draw()});home();

<script>
/* つながりノート AI質問画像共有アドオン v1.0
   index.html の既存コードは変更せず、末尾で読み込む。 */
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const button = document.createElement('button');
  button.id = 'askAIImage';
  button.type = 'button';
  button.textContent = '📸 AIに質問';
  button.style.cssText = 'background:#195c78;color:white;border-color:#195c78;flex:1;font-weight:700';
  const tools = $('readTools');
  if (!tools) return;
  tools.style.flexWrap = 'wrap';
  tools.appendChild(button);

  const wrap = (ctx, text, maxWidth) => {
    const out = [];
    for (const para of String(text || '').split(/\r?\n/)) {
      if (!para) { out.push(''); continue; }
      let line = '';
      for (const ch of Array.from(para)) {
        if (ctx.measureText(line + ch).width > maxWidth && line) {
          out.push(line); line = ch;
        } else line += ch;
      }
      out.push(line);
    }
    return out;
  };
  const image = src => new Promise(resolve => {
    if (!src || !/^data:image\//.test(src)) return resolve(null);
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
  const pngBlob = canvas => new Promise((resolve, reject) =>
    canvas.toBlob(b => b ? resolve(b) : reject(new Error('画像生成に失敗しました')), 'image/png')
  );
  const saveFile = (file) => {
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url; a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  };
  const safeName = s => String(s || '項目').replace(/[\\/:*?"<>|]/g, '_').slice(0, 45);
  const makeCard = async (node, currentMap) => {
    const related = (currentMap.edges || []).filter(e => e.from === node.id || e.to === node.id)
      .map(e => {
        const otherId = e.from === node.id ? e.to : e.from;
        const other = currentMap.nodes.find(n => n.id === otherId);
        return other ? `・${other.title}${e.label ? '（' + e.label + '）' : ''}` : null;
      }).filter(Boolean).slice(0, 12);
    const W = 900, pad = 62, textW = W - pad * 2;
    const cv = document.createElement('canvas');
    const ctx = cv.getContext('2d');
    const blocks = [];
    const add = (text, size, color, weight = '400', gap = 8) => {
      ctx.font = `${weight} ${size}px -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif`;
      const lines = wrap(ctx, text, textW);
      blocks.push({lines, size, color, weight, gap});
    };
    add('つながりノート  /  AI学習カード', 22, '#4c7387', '600', 30);
    add('マップ：' + currentMap.name, 25, '#355c70', '600', 22);
    add(node.title, 39, '#142e42', '700', 22);
    if (node.kind || node.date) add([node.kind, node.date].filter(Boolean).join('  ·  '), 21, '#557385', '400', 26);
    add('【メモ】', 26, '#17647a', '700', 12);
    add(node.note || 'メモはまだありません。', 25, '#243f4e', '400', 24);
    if (related.length) {
      add('【関連項目】', 26, '#17647a', '700', 12);
      add(related.join('\n'), 23, '#243f4e', '400', 22);
    }
    if (node.url) {
      add('【参考URL】', 26, '#17647a', '700', 10);
      add(node.url, 20, '#315f8c', '400', 18);
    }
    const pic = await image(node.photo);
    let picH = 0;
    if (pic) picH = Math.min(440, Math.round(pic.height * Math.min(textW / pic.width, 440 / pic.height)));
    const textH = blocks.reduce((h, b) => h + b.lines.length * (b.size * 1.55) + b.gap, 0);
    cv.width = W; cv.height = Math.ceil(52 + textH + (pic ? picH + 38 : 0) + 85);
    ctx.fillStyle = '#f4f8fb'; ctx.fillRect(0, 0, W, cv.height);
    ctx.fillStyle = '#dcecf3'; ctx.fillRect(0, 0, W, 15);
    let y = 62;
    for (const b of blocks) {
      ctx.font = `${b.weight} ${b.size}px -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif`;
      ctx.fillStyle = b.color; ctx.textBaseline = 'top';
      for (const line of b.lines) { ctx.fillText(line, pad, y); y += b.size * 1.55; }
      y += b.gap;
    }
    if (pic) {
      y += 5;
      const drawW = Math.round(pic.width * picH / pic.height);
      ctx.drawImage(pic, pad, y, drawW, picH);
      y += picH + 25;
    }
    ctx.fillStyle = '#5b7b8a'; ctx.font = '19px -apple-system, sans-serif';
    ctx.fillText('この内容について、わかりやすく説明してください。', pad, cv.height - 53);
    return cv;
  };
  button.addEventListener('click', async () => {
    if (button.disabled) return;
    const currentMap = typeof map !== 'undefined' ? map : null;
    const currentId = typeof readId !== 'undefined' ? readId : null;
    const node = currentMap?.nodes?.find(n => n.id === currentId);
    if (!node) { alert('質問したい項目を選んでください。'); return; }
    button.disabled = true;
    button.textContent = '画像を作成中…';
    try {
      const card = await makeCard(node, currentMap);
      const blob = await pngBlob(card);
      const file = new File([blob], `つながりノート_${safeName(node.title)}.png`, { type: 'image/png' });
      if (navigator.share && (!navigator.canShare || navigator.canShare({ files: [file] }))) {
        try {
          await navigator.share({ files: [file], title: `学習メモ：${node.title}` });
          return;
        } catch (e) {
          if (e.name === 'AbortError') return;
          // 共有できなかった場合は画像保存へフォールバック
        }
      }
      saveFile(file);
      alert('質問用画像を保存しました。ChatGPTで画像を添付して質問してください。');
    } catch (e) {
      alert('画像を作成できませんでした：' + e.message);
    } finally {
      button.disabled = false;
      button.textContent = '📸 AIに質問';
    }
  });
})();


/* つながりノート：テキスト質問共有 v1.1（既存機能を変更しない） */
(() => {
  'use strict';
  const tools = document.getElementById('readTools');
  if (!tools) return;
  tools.style.flexWrap = 'wrap';
  const btn = document.createElement('button');
  btn.id = 'askAIText';
  btn.type = 'button';
  btn.textContent = '📝 AIに質問（文章）';
  btn.style.cssText = 'background:#206c66;color:#fff;border-color:#206c66;font-weight:700;flex:1 1 160px';
  tools.appendChild(btn);

  const dlg = document.createElement('dialog');
  dlg.id = 'aiTextDialog';
  dlg.style.cssText = 'width:min(540px,94vw);max-height:85dvh;overflow:auto';
  const heading = document.createElement('h3');
  heading.textContent = '📝 AIへの質問を作る';
  const info = document.createElement('p');
  info.style.cssText = 'font-size:13px;line-height:1.6;color:#526b78';
  info.textContent = '質問の目的を選ぶと、マップのメモと関連項目を含む文章を作成します。内容は自由に修正できます。';
  const lab = document.createElement('label'); lab.textContent = '質問の目的';
  const sel = document.createElement('select');
  const options = [
    ['easy','📖 わかりやすく説明して'],
    ['why','💡 なぜそうなるの？'],
    ['example','🌍 身近な例で説明して'],
    ['quiz','🧩 理解度を確認したい'],
    ['deep','🔎 もう少し詳しく知りたい'],
    ['free','✍️ 自由に質問する']
  ];
  options.forEach(([v,t]) => {const o=document.createElement('option');o.value=v;o.textContent=t;sel.appendChild(o)});
  const qlab = document.createElement('label');qlab.textContent = '質問文（編集できます）';
  const qbox = document.createElement('textarea');qbox.style.cssText='min-height:105px';
  const plab = document.createElement('label');plab.textContent='ChatGPTに渡す文章のプレビュー（編集できます）';
  const preview = document.createElement('textarea');preview.style.cssText='min-height:230px;font-size:13px;line-height:1.55';
  const status = document.createElement('p');status.style.cssText='font-size:12px;color:#456b77;line-height:1.6';
  const actions = document.createElement('div');actions.style.cssText='display:flex;flex-wrap:wrap;gap:8px;margin-top:12px';
  const mk = (t,primary=false) => {const b=document.createElement('button');b.type='button';b.textContent=t;if(primary)b.className='primary';return b};
  const share=mk('📤 TXTを共有'), copy=mk('📋 文章をコピー'), save=mk('⬇ TXTを保存'), open=mk('📋 コピーしてChatGPTアプリへ',true), close=mk('閉じる');
  actions.append(share,copy,save,open,close);
  dlg.append(heading,info,lab,sel,qlab,qbox,plab,preview,status,actions);
  document.body.appendChild(dlg);

  let ctx=null, automatic=false;
  const prompts={
    easy:'この項目について、初めて学ぶ人にもわかるように、順序立てて説明してください。難しい言葉はかみくだいてください。',
    why:'この項目はなぜそうなるのですか？原因・仕組み・結果を区別して説明してください。',
    example:'この項目を、身近な生活の例や具体例を使って説明してください。',
    quiz:'この項目の理解を確かめる基本問題を1問ずつ出してください。私の回答を待ってから解説してください。',
    deep:'この項目について、基本から一段深い内容まで、関連する概念とのつながりを含めて説明してください。',
    free:''
  };
  const build=()=>{
    if(!ctx)return '';
    const {m,n}=ctx;
    const related=(m.edges||[]).filter(e=>e.from===n.id||e.to===n.id).map(e=>{
      const id=e.from===n.id?e.to:e.from;
      const other=m.nodes.find(v=>v.id===id);
      return other?'・'+other.title+(e.label?'（'+e.label+'）':''):null;
    }).filter(Boolean);
    return ['【つながりノート：AIへの質問】','マップ：'+m.name,'項目：'+n.title,
      n.kind?'種類：'+n.kind:'',n.date?'日付：'+n.date:'',
      '','【学習メモ】',n.note||'（メモなし）',
      ...(related.length?['','【関連項目】',...related]:[]),
      ...(n.url?['','【参考URL】',n.url]:[]),
      ...(n.photo?['','【添付画像】','元の項目には画像が登録されています。画像自体はこのテキストに含まれません。']:[]),
      '','【質問】',qbox.value.trim()||'この内容を説明してください。'].filter(Boolean).join('\n');
  };
  const update=()=>{if(!automatic)preview.value=build()};
  btn.onclick=()=>{
    const m=typeof map!=='undefined'?map:null;
    const n=m?.nodes?.find(x=>x.id===readId);
    if(!n)return alert('質問する項目を選んでください。');
    ctx={m,n};sel.value='easy';qbox.value=prompts.easy;automatic=false;update();
    status.textContent='おすすめ：『コピーしてChatGPTアプリへ』を押し、この会話に戻って貼り付けてください。アプリが開かない場合はホーム画面からChatGPTを開いてください。';
    dlg.showModal();
  };
  sel.onchange=()=>{qbox.value=prompts[sel.value];automatic=false;update()};
  qbox.oninput=()=>{automatic=false;update()};
  preview.oninput=()=>{automatic=true};
  const file=()=>new File([new Blob([preview.value],{type:'text/plain;charset=utf-8'})], 'つながりノート_質問.txt',{type:'text/plain'});
  const download=()=>{const url=URL.createObjectURL(file());const a=document.createElement('a');a.href=url;a.download='つながりノート_質問.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)};
  save.onclick=()=>{download();status.textContent='テキストファイルを保存しました。'};
  copy.onclick=async()=>{try{await navigator.clipboard.writeText(preview.value);status.textContent='文章をコピーしました。ChatGPTの入力欄に貼り付けてください。'}catch(e){preview.focus();preview.select();status.textContent='自動コピーできませんでした。選択した文章を手動でコピーしてください。'}};
  share.onclick=async()=>{
    const f=file();
    if(!navigator.share|| (navigator.canShare&&!navigator.canShare({files:[f]}))){status.textContent='このブラウザではTXTファイル共有ができません。「文章をコピー」を使ってください。';return}
    try{await navigator.share({files:[f],title:'つながりノート：質問'});status.textContent='共有先を開きました。'}
    catch(e){if(e.name!=='AbortError')status.textContent='共有できませんでした。「文章をコピー」を使ってください。'}
  };
  // Web版のゲスト画面へ飛ばさず、コピー後にアプリへの切り替えを試みる。
  // chatgpt:// は端末・アプリ版によって動かない場合があるため、手動で開く案内も残す。
  open.onclick=async()=>{
    if(!preview.value.trim()){status.textContent='質問文を入力してください。';return;}
    let copied=false;
    try{await navigator.clipboard.writeText(preview.value);copied=true;}
    catch(e){preview.focus();preview.select();status.textContent='自動コピーできませんでした。選択中の文章をコピーしてからChatGPTアプリを開いてください。';return;}
    if(copied){
      status.textContent='質問文をコピーしました。ChatGPTアプリが開いたら、この会話を選んで貼り付けてください。開かない場合はホーム画面からアプリを起動してください。';
      // ブラウザへは移動しない。iOSがカスタムURLスキームを処理できればアプリが開く。
      window.location.href='chatgpt://';
    }
  };
  close.onclick=()=>dlg.close();
})();

</script>
